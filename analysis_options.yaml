# Home AI Index - Analysis Options
# Enforces Flutter best practices and code quality standards per constitution

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"
  
  errors:
    # Treat warnings as errors for code quality
    missing_required_param: error
    missing_return: error
    invalid_annotation_target: ignore
  
  strong-mode:
    implicit-casts: false
    implicit-dynamic: false

linter:
  rules:
    # Code Quality & Maintainability (Constitution Principle I)
    - always_declare_return_types
    - always_use_package_imports
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_returning_null_for_future
    - avoid_slow_async_io
    - avoid_types_as_parameter_names
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - package_api_docs
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_fields
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_null_aware_assignments
    - unnecessary_statements
    - use_key_in_widget_constructors
    
    # Performance (Constitution Principle IV)
    - avoid_function_literals_in_foreach_calls
    - prefer_foreach
    - prefer_for_elements_to_map_fromIterable
    - prefer_spread_collections
    
    # State Management (Constitution Principle VI)
    - avoid_redundant_argument_values
    - avoid_setters_without_getters
