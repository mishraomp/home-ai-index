name: 'Setup Flutter'
description: 'Setup Flutter SDK with caching for faster builds'
inputs:
  flutter-version:
    description: 'Flutter SDK version to install'
    required: false
    default: '3.35.6'
  cache-key:
    description: 'Additional cache key component'
    required: false
    default: 'flutter'
outputs:
  flutter-version:
    description: 'Installed Flutter version'
    value: ${{ steps.get-version.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Cache pub dependencies
      uses: actions/cache@v3
      with:
        path: ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Get dependencies
      shell: bash
      run: flutter pub get

    - name: Get Flutter version
      id: get-version
      shell: bash
      run: |
        VERSION=$(flutter --version | head -n1 | awk '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Flutter version: $VERSION"
